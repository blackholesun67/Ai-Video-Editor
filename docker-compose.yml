services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: aive
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aivepass}
      POSTGRES_DB: aivideo
    volumes:
      - pgdata:/var/lib/postgresql/data   # ข้อมูลถาวร ไม่หายเมื่อ down
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aive -d aivideo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - whisper-cache:/root/.cache/huggingface
      - transcript-cache:/app/transcript_cache
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg2://aive:${DB_PASSWORD:-aivepass}@postgres:5432/aivideo
      - JWT_SECRET=${JWT_SECRET:-change-me-dev-secret}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy      # รอ Redis พร้อมจริงก่อน start (ไม่ใช่แค่ลำดับ)
      postgres:
        condition: service_healthy      # รอ DB พร้อมก่อน (สร้างตาราง users/jobs)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # --beat: ฝัง scheduler ไว้ใน worker เลย (มี worker ตัวเดียว ปลอดภัย)
    #         → รัน cleanup_task ตามเวลาใน beat_schedule (tasks.py) โดยไม่ต้องเปิด container เพิ่ม
    command: celery -A tasks worker --beat --loglevel=info --pool=solo --concurrency=1
    restart: unless-stopped
    # ⚠️ กัน OOM ล้มทั้ง host: worker โหลด Whisper + ffmpeg กิน RAM ได้เยอะ
    #    จำกัดไว้ → Docker kill แค่ container นี้ ไม่ใช่ทั้งเครื่อง
    #    ตั้งต่ำไปงานวิดีโอยาวจะโดน kill — ปรับตาม RAM เครื่อง (host นี้ ~8GB)
    mem_limit: 5g
    volumes:
      - ./backend/storage:/app/storage
      - whisper-cache:/root/.cache/huggingface
      - transcript-cache:/app/transcript_cache
    env_file:
      - ./backend/.env
    environment:
      - WHISPER_BATCH_SIZE=4
      - DATABASE_URL=postgresql+psycopg2://aive:${DB_PASSWORD:-aivepass}@postgres:5432/aivideo
      - JWT_SECRET=${JWT_SECRET:-change-me-dev-secret}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app-network
    # GPU passthrough ปิดไว้ — เครื่องนี้ไม่มีการ์ดจอ NVIDIA (จะรัน Whisper บน CPU แทน)

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy      # รอ backend health ก่อน serve (กัน 502 ตอน boot)
    networks:
      - app-network

  # ── Adminer — หน้าเว็บจัดการ DB (dev tool) เปิดที่ http://localhost:8080 ──
  # login: System=PostgreSQL, Server=postgres, Username=aive, Password=aivepass, Database=aivideo
  # เป็นเครื่องมือ dev เท่านั้น — production ไม่ควรเปิด port นี้ทิ้งไว้
  adminer:
    image: adminer:4
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres   # เติม server ให้อัตโนมัติในหน้า login
    volumes:
      # ธีม UI — Adminer โหลด adminer.css อัตโนมัติถ้าวางไว้ข้าง index
      - ./adminer/adminer.css:/var/www/html/adminer.css:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

volumes:
  whisper-cache:
  transcript-cache:
  pgdata:

networks:
  app-network:
    driver: bridge
