# IP จริงของผู้ใช้ — หลัง Cloudflare Tunnel Cloudflare ใส่ CF-Connecting-IP (ปลอมไม่ได้ ต่างจาก X-Forwarded-For
# ที่ผู้ใช้ใส่เองมาล่วงหน้าได้) ; เข้าตรงผ่าน http://localhost (ไม่มี header นี้) ใช้ IP ที่ต่อเข้ามาเอง
map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # /api/* → backend:8000 โดย "ตัด prefix /api ออก" (เหมือน handle_path ใน Caddyfile)
    #   frontend build ด้วย VITE_API_URL=/api → เรียก same-origin ไม่ต้องพึ่ง CORS
    # ใช้ resolver + ตัวแปรให้ nginx หา IP ของ backend ใหม่ทุกครั้ง — ไม่งั้น nginx จำ IP ตอนบูต
    # แล้วได้ 502 ทันทีที่ backend ถูกสร้างใหม่ (docker compose up -d) ; ผลพลอยได้: nginx บูตได้แม้ backend ยังไม่พร้อม
    location /api/ {
        resolver 127.0.0.11 valid=10s;          # DNS ในตัวของ Docker
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        client_max_body_size 2g;                # ตรงกับ MAX_FILE_SIZE_MB ของ backend (เดิม nginx จำกัด 1m)
        proxy_request_buffering off;            # ส่งไฟล์อัปโหลดต่อให้ backend ทันที ไม่พักลงดิสก์ในคอนเทนเนอร์ 128m
        proxy_buffering off;                    # วิดีโอ/ดาวน์โหลดไหลตรง ไม่เขียนไฟล์ชั่วคราว (Range ยังผ่านปกติ)
        proxy_read_timeout 1800s;               # เท่ากับ timeout อัปโหลดฝั่งหน้าเว็บ (30 นาที)
        proxy_send_timeout 1800s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;   # backend (core/ratelimit.py) อ่านค่าแรกของ header นี้เป็น IP ผู้ใช้
    }

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
